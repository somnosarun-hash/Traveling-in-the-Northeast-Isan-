<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>เที่ยวอีสาน</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;color:white;font-family:Tahoma,"Noto Sans Thai",sans-serif;background:radial-gradient(ellipse at 86% 28%,rgba(196,218,147,.45),transparent 33%),linear-gradient(115deg,#245b55,#397b6c 58%,#89a77e)}button,input{font:inherit}.topbar{display:flex;min-height:96px;align-items:center;justify-content:space-between;gap:16px;padding:14px 4.2%;background:rgba(25,68,61,.45);border-top:4px solid rgba(255,255,255,.12)}.brand{display:flex;align-items:center;gap:14px}.brand-icon{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;color:#467856;background:#e8f1df;font-size:1.5rem}.site-name{width:155px;padding:5px 0;border:0;border-bottom:1px dashed rgba(255,255,255,.6);color:white;background:transparent;font-size:1.15rem;font-weight:800}.language-actions{display:flex;align-items:center;gap:8px}.language-button{display:inline-flex;min-width:60px;min-height:46px;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.55);border-radius:999px;color:white;background:rgba(255,255,255,.12);cursor:pointer}.language-button[aria-pressed="true"]{color:#244f49;background:white}.language-button:hover{background:rgba(255,255,255,.25)}.hero{display:flex;min-height:calc(100vh - 96px);align-items:center;padding:65px 4.2% 100px}.hero-content{max-width:760px}.eyebrow{margin-bottom:20px;color:#dcedb9;font-size:clamp(.85rem,2vw,1.3rem);font-weight:800;letter-spacing:1.7px}h1{margin:0 0 24px;font-size:clamp(2.6rem,7vw,4.8rem);line-height:1.12}.hero-description{max-width:700px;margin:0 0 42px;color:rgba(255,255,255,.92);font-size:clamp(1.05rem,2.4vw,1.4rem);line-height:1.9}.start-button{display:inline-flex;min-height:64px;align-items:center;gap:15px;padding:14px 26px;border-radius:12px;color:#244f49;background:#f1f5e9;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:800;text-decoration:none}.start-button:hover{background:white}@media(max-width:600px){.topbar{min-height:76px;gap:8px;padding:10px 4%}.brand{gap:7px}.brand-icon{width:38px;height:38px;border-radius:12px}.site-name{width:115px;font-size:.9rem}.language-actions{gap:5px}.language-button{min-width:43px;min-height:38px;font-size:.85rem}.hero{min-height:calc(100vh - 76px);padding:50px 6% 75px}.start-button{min-height:56px;padding:12px 18px}}
</style></head><body><header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">🌿</span><input id="site-name" class="site-name" value="เที่ยวอีสาน" maxlength="32" aria-label="ชื่อเว็บไซต์"></div><div class="language-actions" aria-label="เลือกภาษา"><button class="language-button" type="button" data-lang="th" aria-pressed="true">ไทย</button><button class="language-button" type="button" data-lang="en" aria-pressed="false">EN</button></div></header><main class="hero"><section class="hero-content"><div class="eyebrow">NORTHEASTERN THAILAND</div><h1 data-i18n="heroTitle">ออกเดินทาง<br>ไปค้นพบอีสาน</h1><p class="hero-description" data-i18n="heroDescription">เลือกจังหวัดและรูปแบบการเดินทางที่ใช่ แล้วค้นพบธรรมชาติ วัฒนธรรม และเรื่องราวท้องถิ่นของภาคอีสาน</p><a class="start-button" href="places.html"><span data-i18n="start">เริ่มสำรวจสถานที่ท่องเที่ยว</span><span aria-hidden="true">→</span></a></section></main><script>
const translations={th:{heroTitle:"ออกเดินทาง<br>ไปค้นพบอีสาน",heroDescription:"เลือกจังหวัดและรูปแบบการเดินทางที่ใช่ แล้วค้นพบธรรมชาติ วัฒนธรรม และเรื่องราวท้องถิ่นของภาคอีสาน",start:"เริ่มสำรวจสถานที่ท่องเที่ยว",title:"คู่มือเที่ยวภาคอีสาน",siteName:"เที่ยวอีสาน",siteNameLabel:"ชื่อเว็บไซต์"},en:{heroTitle:"Set out to<br>discover Isan",heroDescription:"Choose a province and travel style to discover the nature, culture, and local stories of northeastern Thailand.",start:"Explore attractions",title:"Isan Travel Guide",siteName:"Isan Travel",siteNameLabel:"Website name"}};
function readSaved(key){try{return localStorage.getItem(key)}catch(e){return null}}function save(key,value){try{localStorage.setItem(key,value)}catch(e){}}
const savedLanguage=readSaved("isan-language");let language=translations[savedLanguage]?savedLanguage:"th";const siteNameInput=document.getElementById("site-name");siteNameInput.value=readSaved("isan-site-name")||translations.th.siteName;
function updateLanguage(){const currentName=siteNameInput.value.trim();const isDefaultName=currentName===translations.th.siteName||currentName===translations.en.siteName;language=translations[language]?language:"th";document.documentElement.lang=language;document.querySelectorAll("[data-i18n]").forEach(element=>{element.innerHTML=translations[language][element.dataset.i18n]});document.querySelectorAll(".language-button").forEach(button=>{button.setAttribute("aria-pressed",String(button.dataset.lang===language))});if(isDefaultName||currentName===""){siteNameInput.value=translations[language].siteName;save("isan-site-name",siteNameInput.value)}siteNameInput.setAttribute("aria-label",translations[language].siteNameLabel);updateTitle()}
function updateTitle(){const name=siteNameInput.value.trim()||translations[language].siteName;document.title=`${name} — ${translations[language].title}`}
document.querySelectorAll(".language-button").forEach(button=>{button.addEventListener("click",()=>{language=button.dataset.lang;save("isan-language",language);updateLanguage()})});siteNameInput.addEventListener("input",()=>{save("isan-site-name",siteNameInput.value);updateTitle()});updateLanguage();
</script></body></html>
