<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>สถานที่ท่องเที่ยวอีสาน</title><style>
:root{--green:#2f7668;--green-dark:#214f49;--cream:#f5f7f2;--text:#263b37;--muted:#71817c;--line:#e2e9e3}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--cream);font-family:Tahoma,"Noto Sans Thai",sans-serif}.topbar{position:sticky;z-index:10;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 6%;color:white;background:var(--green-dark)}.brand,.nav-actions,.language-actions{display:flex;align-items:center;gap:8px}.brand{color:white;text-decoration:none;font-weight:800}.brand-icon{display:grid;width:38px;height:38px;place-items:center;border-radius:11px;color:var(--green-dark);background:#e3f0df}.nav-button,.language-button{min-height:38px;padding:8px 11px;border:1px solid rgba(255,255,255,.4);border-radius:8px;color:white;background:rgba(255,255,255,.1);text-decoration:none;cursor:pointer;font:inherit;font-weight:700}.language-button{border-radius:999px}.language-button[aria-pressed="true"]{color:var(--green-dark);background:white}main{width:min(1120px,90%);min-height:75vh;margin:0 auto;padding:42px 0 70px}h1{color:var(--green-dark)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0 30px;padding:22px;border:1px solid var(--line);border-radius:13px;background:white}.field label{display:block;margin-bottom:8px;color:var(--green-dark);font-weight:800}.field select{width:100%;min-height:48px;padding:10px 12px;border:1px solid #d8e2dc;border-radius:8px;background:white;font:inherit}.filter-note{grid-column:1/-1;margin:0;color:var(--muted);line-height:1.7}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 16px}.section-heading h2{margin:0;color:var(--green-dark)}.result-count{padding:7px 11px;border-radius:999px;color:var(--green-dark);background:#e6f0e8;font-weight:800;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-width:0;padding:14px;border:1px solid var(--line);border-radius:13px;background:white}.card h3{color:var(--green-dark)}.card-description{color:var(--muted);line-height:1.7}.map-link{display:inline-block;margin-top:10px;padding:9px 13px;border-radius:7px;color:white;background:var(--green);font-weight:800;text-decoration:none}footer{padding:22px;color:white;background:var(--green-dark);text-align:center}@media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.topbar{flex-wrap:wrap;padding:10px 3%}.brand{flex:1 1 100%}.language-actions{margin-left:auto}main{width:90%}.filters,.cards{grid-template-columns:1fr}.section-heading{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon" aria-hidden="true">🌿</span><span data-i18n="brand">เที่ยวอีสาน</span></a><nav class="nav-actions" aria-label="เมนูนำทาง"><a class="nav-button" href="index.html"><span data-i18n="home">หน้าหลัก</span></a></nav><div class="language-actions" aria-label="เลือกภาษา"><button class="language-button" type="button" data-lang="th" aria-pressed="true">ไทย</button><button class="language-button" type="button" data-lang="en" aria-pressed="false">EN</button></div></header><main><h1 data-i18n="title">สถานที่ท่องเที่ยวอีสาน</h1><section class="filters"><div class="field"><label for="province" data-i18n="provinceLabel">เลือกจังหวัด</label><select id="province"></select></div><div class="field"><label for="audience" data-i18n="audienceLabel">กลุ่มผู้ใช้งาน</label><select id="audience"><option value="tourist" data-i18n="tourist">นักท่องเที่ยว</option><option value="official" data-i18n="official">ข้าราชการ / หน่วยงาน</option><option value="__back" data-i18n="back">ย้อนกลับ</option></select></div><p class="filter-note" id="audience-note" aria-live="polite"></p></section><section><div class="section-heading"><h2 id="province-title"></h2><span class="result-count" id="result-count"></span></div><div class="cards" id="cards"></div></section></main><footer id="footer-name">เที่ยวอีสาน</footer><script>
const attractions={
"นครราชสีมา":[{name:"อุทยานแห่งชาติเขาใหญ่",type:"ธรรมชาติ"},{name:"อุทยานประวัติศาสตร์พิมาย",type:"ประวัติศาสตร์"}],
"กาฬสินธุ์":[{name:"พิพิธภัณฑ์สิรินธร",type:"พิพิธภัณฑ์"},{name:"วนอุทยานภูแฝก",type:"ธรรมชาติ"}],
"ขอนแก่น":[{name:"พระมหาธาตุแก่นนคร",type:"วัฒนธรรม"},{name:"พิพิธภัณฑ์ไดโนเสาร์ภูเวียง",type:"พิพิธภัณฑ์"}],
"ชัยภูมิ":[{name:"อุทยานแห่งชาติป่าหินงาม",type:"ธรรมชาติ"},{name:"อุทยานแห่งชาติตาดโตน",type:"ธรรมชาติ"}],
"นครพนม":[{name:"พระธาตุพนม",type:"วัฒนธรรม"},{name:"ลานพญาศรีสัตตนาคราช",type:"แลนด์มาร์ก"}],
"บึงกาฬ":[{name:"หินสามวาฬ",type:"ธรรมชาติ"},{name:"วัดภูทอก",type:"วัฒนธรรม"}],
"บุรีรัมย์":[{name:"ปราสาทหินพนมรุ้ง",type:"ประวัติศาสตร์"},{name:"ปราสาทเมืองต่ำ",type:"ประวัติศาสตร์"}],
"มหาสารคาม":[{name:"พระธาตุนาดูน",type:"วัฒนธรรม"},{name:"กู่สันตรัตน์",type:"ประวัติศาสตร์"}],

"ร้อยเอ็ด":[{name:"บึงพลาญชัย",type:"ธรรมชาติ"},{name:"วัดบูรพาภิราม",type:"วัฒนธรรม"}],
"เลย":[{name:"อุทยานแห่งชาติภูกระดึง",type:"ธรรมชาติ"},{name:"ถนนคนเดินเชียงคาน",type:"ชุมชน"}],
"ศรีสะเกษ":[{name:"ผามออีแดง",type:"ธรรมชาติ"},{name:"วัดป่ามหาเจดีย์แก้ว",type:"วัฒนธรรม"}],
"สกลนคร":[{name:"วัดพระธาตุเชิงชุมวรวิหาร",type:"วัฒนธรรม"},{name:"อุทยานแห่งชาติภูพาน",type:"ธรรมชาติ"}],
"สุรินทร์":[{name:"ปราสาทศีขรภูมิ",type:"ประวัติศาสตร์"},{name:"หมู่บ้านทอผ้าไหมบ้านท่าสว่าง",type:"ชุมชน"}],
"หนองคาย":[{name:"ศาลาแก้วกู่",type:"วัฒนธรรม"},{name:"วัดโพธิ์ชัย",type:"วัฒนธรรม"}],
"หนองบัวลำภู":[{name:"วัดถ้ำกลองเพล",type:"วัฒนธรรม"},{name:"อุทยานแห่งชาติภูเก้า-ภูพานคำ",type:"ธรรมชาติ"}],
"อำนาจเจริญ":[{name:"พุทธอุทยานพระมงคลมิ่งเมือง",type:"วัฒนธรรม"},{name:"แก่งคันสูง",type:"ธรรมชาติ"}],
"อุดรธานี":[{name:"แหล่งโบราณคดีบ้านเชียง",type:"ประวัติศาสตร์"},{name:"วัดป่าภูก้อน",type:"วัฒนธรรม"}],
"อุบลราชธานี":[{name:"สามพันโบก",type:"ธรรมชาติ"},{name:"อุทยานแห่งชาติผาแต้ม",type:"ธรรมชาติ"}]};
const provinceNamesEnglish={"นครราชสีมา":"Nakhon Ratchasima","กาฬสินธุ์":"Kalasin","ขอนแก่น":"Khon Kaen","ชัยภูมิ":"Chaiyaphum","นครพนม":"Nakhon Phanom","บึงกาฬ":"Bueng Kan","บุรีรัมย์":"Buri Ram","มหาสารคาม":"Maha Sarakham","มุกดาหาร":"Mukdahan","ยโสธร":"Yasothon","ร้อยเอ็ด":"Roi Et","เลย":"Loei","ศรีสะเกษ":"Si Sa Ket","สกลนคร":"Sakon Nakhon","สุรินทร์":"Surin","หนองคาย":"Nong Khai","หนองบัวลำภู":"Nong Bua Lam Phu","อำนาจเจริญ":"Amnat Charoen","อุดรธานี":"Udon Thani","อุบลราชธานี":"Ubon Ratchathani"};
const typeNamesEnglish={"ธรรมชาติ":"Nature","ประวัติศาสตร์":"History","พิพิธภัณฑ์":"Museum","วัฒนธรรม":"Culture","แลนด์มาร์ก":"Landmark","ชุมชน":"Community"};
const attractionNamesEnglish={"อุทยานแห่งชาติเขาใหญ่":"Khao Yai National Park","อุทยานประวัติศาสตร์พิมาย":"Phimai Historical Park","พิพิธภัณฑ์สิรินธร":"Sirindhorn Museum","วนอุทยานภูแฝก":"Phu Faek Forest Park","พระมหาธาตุแก่นนคร":"Phra Mahathat Kaen Nakhon","พิพิธภัณฑ์ไดโนเสาร์ภูเวียง":"Phu Wiang Dinosaur Museum","อุทยานแห่งชาติป่าหินงาม":"Pa Hin Ngam National Park","อุทยานแห่งชาติตาดโตน":"Tat Ton National Park","พระธาตุพนม":"Phra That Phanom","ลานพญาศรีสัตตนาคราช":"Phaya Sri Sattanakhan Naga Monument","หินสามวาฬ":"Three Whale Rock","วัดภูทอก":"Wat Phu Tok","ปราสาทหินพนมรุ้ง":"Phanom Rung Historical Park","ปราสาทเมืองต่ำ":"Muang Tam Sanctuary","พระธาตุนาดูน":"Phra That Na Dun","กู่สันตรัตน์":"Ku Santarat","อุทยานแห่งชาติภูผาเทิบ":"Phu Pha Thoep National Park","ตลาดอินโดจีน":"Indochina Market","พญาคันคาก":"Phaya Khan Khak Museum","พระธาตุอานนท์":"Phra That Anon","บึงพลาญชัย":"Bueng Phlan Chai","วัดบูรพาภิราม":"Wat Buraphaphiram","อุทยานแห่งชาติภูกระดึง":"Phu Kradueng National Park","ถนนคนเดินเชียงคาน":"Chiang Khan Walking Street","ผามออีแดง":"Pha Mo I Daeng","วัดป่ามหาเจดีย์แก้ว":"Wat Pa Maha Chedi Kaeo","วัดพระธาตุเชิงชุมวรวิหาร":"Wat Phra That Choeng Chum Worawihan","อุทยานแห่งชาติภูพาน":"Phu Phan National Park","ปราสาทศีขรภูมิ":"Sikhoraphum Stone Castle","หมู่บ้านทอผ้าไหมบ้านท่าสว่าง":"Ban Tha Sawang Silk Weaving Village","ศาลาแก้วกู่":"Sala Keoku","วัดโพธิ์ชัย":"Wat Pho Chai","วัดถ้ำกลองเพล":"Wat Tham Klong Phen","อุทยานแห่งชาติภูเก้า-ภูพานคำ":"Phu Kao–Phu Phan Kham National Park","พุทธอุทยานพระมงคลมิ่งเมือง":"Phra Mongkhon Ming Mueang Buddha Park","แก่งคันสูง":"Kaeng Khan Sung","แหล่งโบราณคดีบ้านเชียง":"Ban Chiang Archaeological Site","วัดป่าภูก้อน":"Wat Pa Phu Kon","สามพันโบก":"Sam Phan Bok","อุทยานแห่งชาติผาแต้ม":"Pha Taem National Park"};
const translations={th:{brand:"เที่ยวอีสาน",home:"หน้าหลัก",back:"ย้อนกลับ",title:"สถานที่ท่องเที่ยวอีสาน",provinceLabel:"เลือกจังหวัด",audienceLabel:"กลุ่มผู้ใช้งาน",tourist:"นักท่องเที่ยว",official:"ข้าราชการ / หน่วยงาน",placesTitle:"สถานที่แนะนำใน",results:"แห่ง",map:"เปิดแผนที่",typeLabel:"ประเภท",touristNote:"คำแนะนำสำหรับนักท่องเที่ยว: เลือกสถานที่ตามความสนใจ ตรวจสอบเวลาเปิดให้บริการและข้อมูลการเดินทางก่อนออกเดินทาง",officialNote:"คำแนะนำสำหรับข้าราชการและหน่วยงาน: เหมาะสำหรับวางแผนศึกษาดูงานหรือกิจกรรมกลุ่ม ควรติดต่อสถานที่ล่วงหน้าเพื่อยืนยันการรองรับคณะ"},en:{brand:"Isan Travel",home:"Home",back:"Back",title:"Isan Attractions",provinceLabel:"Choose a province",audienceLabel:"Visitor group",tourist:"Tourists",official:"Government staff / organizations",placesTitle:"Recommended places in",results:"places",map:"Open map",typeLabel:"Type",touristNote:"For tourists: choose places that match your interests and check opening hours before traveling.",officialNote:"For government staff and organizations: suitable for study visits and group activities. Contact the venue in advance."}};
function readSaved(key){try{return localStorage.getItem(key)}catch(e){return null}}function save(key,value){try{localStorage.setItem(key,value)}catch(e){}}
const provinceSelect=document.getElementById("province"),audienceSelect=document.getElementById("audience"),cardsContainer=document.getElementById("cards"),languageButtons=document.querySelectorAll(".language-button");const savedLanguage=readSaved("isan-language");let language=translations[savedLanguage]?savedLanguage:"th";let previousProvince="นครราชสีมา",previousAudience="tourist";
function t(key){return translations[language][key]}function getProvinceName(province){return language==="en"?provinceNamesEnglish[province]||province:province}function getTypeName(type){return language==="en"?typeNamesEnglish[type]||type:type}function getAttractionName(name){return language==="en"?attractionNamesEnglish[name]||name:name}
function populateProvinces(){const currentProvince=provinceSelect.value;const selectedProvince=currentProvince&&currentProvince!=="__back"?currentProvince:previousProvince;provinceSelect.replaceChildren();Object.keys(attractions).forEach(province=>{const option=document.createElement("option");option.value=province;option.textContent=getProvinceName(province);provinceSelect.appendChild(option)});const backOption=document.createElement("option");backOption.value="__back";backOption.textContent=t("back");provinceSelect.appendChild(backOption);provinceSelect.value=attractions[selectedProvince]?selectedProvince:"นครราชสีมา";previousProvince=provinceSelect.value}
function updateLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-i18n]").forEach(element=>{const translatedText=translations[language][element.dataset.i18n];if(translatedText)element.textContent=translatedText});languageButtons.forEach(button=>{button.setAttribute("aria-pressed",String(button.dataset.lang===language))});const backOption=audienceSelect.querySelector('option[value="__back"]');if(backOption)backOption.textContent=t("back");populateProvinces();renderAttractions()}
function makeCard(province,place){const card=document.createElement("article");card.className="card";const name=document.createElement("h3");name.textContent=getAttractionName(place.name);const description=document.createElement("p");description.className="card-description";description.textContent=`${t("typeLabel")}: ${getTypeName(place.type)}`;const mapLink=document.createElement("a");const mapQuery=`${place.name} ${province} Thailand`;mapLink.className="map-link";mapLink.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery)}`;mapLink.target="_blank";mapLink.rel="noopener noreferrer";mapLink.textContent=`↗ ${t("map")}`;card.append(name,description,mapLink);return card}
function renderAttractions(){const province=provinceSelect.value;if(!province||province==="__back")return;const places=attractions[province]||[];document.getElementById("province-title").textContent=`${t("placesTitle")} ${getProvinceName(province)}`;document.getElementById("result-count").textContent=`${places.length} ${t("results")}`;document.getElementById("audience-note").textContent=audienceSelect.value==="official"?t("officialNote"):t("touristNote");cardsContainer.replaceChildren();places.forEach(place=>cardsContainer.appendChild(makeCard(province,place)))}
languageButtons.forEach(button=>button.addEventListener("click",()=>{language=button.dataset.lang;save("isan-language",language);updateLanguage()}));provinceSelect.addEventListener("change",()=>{if(provinceSelect.value==="__back"){provinceSelect.value=previousProvince;return}previousProvince=provinceSelect.value;renderAttractions()});audienceSelect.addEventListener("change",()=>{if(audienceSelect.value==="__back"){audienceSelect.value=previousAudience;return}previousAudience=audienceSelect.value;renderAttractions()});updateLanguage();
</script></body></html>
